[project]
name = "agentframe"
version = "0.2.0"
description = "A hook-driven agent framework: state-machine core + middleware stacking"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph >= 1.2, < 2",
    "langchain-core >= 0.3, < 2",
    "httpx >= 0.27, < 1",
]

[project.optional-dependencies]
dev = ["pytest >= 8", "basedpyright >= 1.39"]

[build-system]
requires = ["setuptools >= 75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentframe*"]

[tool.basedpyright]
# LLM/JSON 载荷与 LangGraph 边界天然用 Any；钩子基类参数是协议契约；builder 模式返回值有意忽略。
reportExplicitAny = "none"
reportUnusedParameter = "none"
reportMissingTypeStubs = "none"
reportUnusedCallResult = "none"

# tests/ 故意保持松类型（本地中间件违反 dataclass 类型等），unknown 类规则按路径校准
executionEnvironments = [
  { root = "tests", extraPaths = ["."], reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none", reportUnknownMemberType = "none", reportUnknownArgumentType = "none", reportAny = "none" },
  { root = "." },
]

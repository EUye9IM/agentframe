[project]
name = "agentframe"
version = "0.1.0"
description = "A lightweight agent framework built on LangGraph and litellm"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph >= 0.2, < 2",
    "litellm >= 1.60, < 2",
    "langchain-core >= 0.3, < 2",
    "fastapi >= 0.100, < 1",
]

[project.optional-dependencies]
mcp = ["mcp >= 1.0"]
dev = ["pytest >= 8", "pytest-asyncio >= 0.24"]

[project.scripts]
afcli = "agentframe.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools >= 75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentframe*"]

[project]
name = "agentframe"
version = "0.2.0"
description = "A hook-driven agent framework: state-machine core + middleware stacking"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph >= 1.2, < 2",
    "openai >= 1.0, < 2",
    "langchain-core >= 0.3, < 2",
    "mcp >= 1.0",
]

[project.optional-dependencies]
dev = ["basedpyright >= 1.39"]

[project.scripts]
afcli = "agentframe.cli.main:main"

[build-system]
requires = ["setuptools >= 75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentframe*"]

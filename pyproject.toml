[project]
name = "agentframe"
version = "0.1.0"
description = "A lightweight agent framework built on LangGraph and litellm"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph >= 0.2",
    "litellm >= 1.60",
    "langchain-core >= 0.3",
]

[project.optional-dependencies]
mcp = ["mcp >= 1.0"]

[build-system]
requires = ["setuptools >= 75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentframe*"]
